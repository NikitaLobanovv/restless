name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 запрещает непривилегированные user namespaces без профиля AppArmor,
      # и песочница Chromium в Electron падает. На одноразовом раннере снимаем ограничение.
      - name: Разрешить user namespaces для песочницы Electron
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: E2E (Playwright for Electron)
        run: xvfb-run --auto-servernum make e2e

  build:
    needs: e2e
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сборка и публикация в GitHub Releases
        # beta-канал — для тегов вида v1.2.0-beta.1
        run: npx electron-vite build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Подпись необязательна на первом этапе (см. README). Если секреты заданы — сборка подписывается.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
