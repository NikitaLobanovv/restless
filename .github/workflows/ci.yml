name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint + Prettier
        run: npm run lint
      - name: Типы
        run: npm run typecheck
      - name: Unit-тесты с покрытием
        run: npm run test:coverage
      - name: Интеграционные тесты (PostgreSQL + echo-api в Docker)
        run: make test-int
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
